      - heading "Utility, Option Value, and Correction After Measurement" [level=3] [ref=f5e1870]
      - paragraph [ref=f5e1871]: Three older fields each contribute one rule to this contract.
      - paragraph [ref=f5e1872]:
        - text: "Expected-utility theory supplies the local decision criterion: choose the action with greatest expected utility under the current interpretation of the world ["
        - link "33" [ref=f5e1873] [cursor=pointer]:
          - /url: ../../references.html#ref-33
        - text: "] ["
        - link "34" [ref=f5e1874] [cursor=pointer]:
