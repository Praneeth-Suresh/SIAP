        - text: "]."
      - paragraph [ref=f5e1875]:
        - text: Sequential decision theory adds that a locally attractive action can be bad if it destroys future options. That is the lesson captured by Bellman recursion in fully observed settings, where the value of a state is defined in terms of the values of the states it leads to [
        - link "5" [ref=f5e1876] [cursor=pointer]:
          - /url: ../../references.html#ref-5
        - text: "]."
      - paragraph [ref=f5e1877]:
        - text: "Feedback control adds the implementation discipline: plans must be corrected after new measurements arrive, because disturbances and model error are normal rather than exceptional ["
        - link "36" [ref=f5e1878] [cursor=pointer]:
          - /url: ../../references.html#ref-36
        - text: "] ["
        - link "39" [ref=f5e1879] [cursor=pointer]:
