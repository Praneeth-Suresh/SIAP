      - heading "Goals, Environments, and Actions" [level=1] [ref=f5e71]
      - blockquote [ref=f5e72]:
        - paragraph [ref=f5e73]:
          - emphasis [ref=f5e74]: “that which all things aim at.”
        - paragraph [ref=f5e75]:
          - text: — Aristotle,
          - emphasis [ref=f5e76]: Nicomachean Ethics
          - text: (c. 340 BCE), Book I, opening paragraph.
          - link "Source" [ref=f5e77] [cursor=pointer]:
            - /url: https://www.gutenberg.org/cache/epub/8438/pg8438.html
          - text: ", accessed 2026-08-06. Public-domain original and translation; quotation transcribed from Project Gutenberg.."
      - paragraph [ref=f5e78]: "Agent-427 is born with a narrow constitution: it may inspect the repository, but it may not write, deploy, or remember anything durably. Before anything clever can happen, it needs three things: something it is trying to achieve, a world it is acting inside, and a list of moves it is allowed to make. Those three things get written down here as a contract. Every later chapter extends that contract, and it is the first thing you inspect when an agent misbehaves."
      - paragraph [ref=f5e79]: "An agent is not a model that emits impressive text. It is an interpreter for situated action. At each step it does four things:"
      - list [ref=f5e80]:
        - listitem [ref=f5e81]: it reads a partial observation, meaning it sees only some of what is going on;
        - listitem [ref=f5e82]: it updates what it thinks is going on;
        - listitem [ref=f5e83]: it chooses an admissible action, meaning one the system permits;
        - listitem [ref=f5e84]: it accepts that the action changes the next problem it must solve.
      - paragraph [ref=f5e85]: Before we can discuss belief, memory, planning, or control, we need the contract that this interpreter is running.
      - heading "The Three Parts of the Contract" [level=2] [ref=f5e86]
      - paragraph [ref=f5e87]: "The contract has three parts, and each answers a different question:"
      - list [ref=f5e88]:
        - listitem [ref=f5e89]:
          - text: A
          - strong [ref=f5e90]: goal
          - text: says what outcomes count as better or worse.
        - listitem [ref=f5e91]:
          - text: An
          - strong [ref=f5e92]: environment
          - text: says what can change outside the agent, and what the agent can observe.
        - listitem [ref=f5e93]:
          - text: An
          - strong [ref=f5e94]: action vocabulary
          - text: says which interventions are legal, costly, reversible, and checkable.
      - paragraph [ref=f5e95]:
        - text: Without these parts, the system may still be useful. But its behavior is difficult to compare, debug, or govern [
        - link "2" [ref=f5e96] [cursor=pointer]:
          - /url: ../../references.html#ref-2
        - text: "]. That difficulty is the practical cost of leaving the contract implicit."
      - heading "A Coding Agent Under Deadline" [level=2] [ref=f5e97]
      - paragraph [ref=f5e98]: "Imagine a coding agent tasked with shipping a bug fix before a release freeze. Its goal is not \"write something clever.\" A defensible goal combines four pressures at once:"
      - list [ref=f5e99]:
        - listitem [ref=f5e100]: the value of the task itself;
        - listitem [ref=f5e101]: the risk of causing a regression, meaning breaking something that used to work;
        - listitem [ref=f5e102]: deadline pressure;
        - listitem [ref=f5e103]: cost.
      - paragraph [ref=f5e104]: Its environment is only partly visible to it. That environment includes a partially observed repository, flaky continuous integration (CI, the automated system that builds and tests each change), hidden downstream dependencies, and a user whose constraints may be underspecified.
      - paragraph [ref=f5e105]:
        - text: "Its actions are ordinary engineering moves: reading files, editing code, running tests, asking for clarification, and opening a pull request. Each action does three things at once. It produces an observation, it consumes budget, and it may make later actions easier or harder ["
        - link "3" [ref=f5e106] [cursor=pointer]:
          - /url: ../../references.html#ref-3
        - text: "] ["
        - link "7" [ref=f5e107] [cursor=pointer]:
          - /url: ../../references.html#ref-7
        - text: "]."
      - heading "The Smallest Agent Interpreter" [level=2] [ref=f5e108]
      - paragraph [ref=f5e109]:
        - text: This is already enough to write the smallest agent interpreter. The pseudocode below keeps a running
        - code [ref=f5e110]: state
        - text: and a
        - code [ref=f5e111]: history
        - text: "of what happened, then loops: observe, update, choose, execute, record."
      - code [ref=f5e113]: "state <- initial_state() history <- [] while not terminated(state, history): observation <- observe(environment, state) state <- update_state(state, observation) action <- choose_action(goal, state, legal_actions(state)) outcome <- execute(action) history <- history + [(observation, action, outcome)]"
      - paragraph [ref=f5e114]: "This loop is the experimental baseline for the rest of the book. Before adding retrieval, planning, reflection, tool governance, or multiple agents, we can ask what this plain interpreter achieves on its own. Five measurements are enough to start:"
      - list [ref=f5e115]:
        - listitem [ref=f5e116]: whether it completes the task;
        - listitem [ref=f5e117]: how far it gets before stopping;
        - listitem [ref=f5e118]: how many tokens and tool calls it spends;
        - listitem [ref=f5e119]: how long it waits on feedback;
        - listitem [ref=f5e120]: which failures remain.
      - paragraph [ref=f5e121]: Later patterns are not magic additions. They are controlled mutations of this loop, and each one should be judged against the baseline this plain interpreter sets.
      - paragraph [ref=f5e122]:
        - text: The rest of the chapter refines the three vague functions in this loop. Topic 2 (Belief, Uncertainty, and Decision) asks what
        - code [ref=f5e123]: update_state
        - text: should mean when the world is uncertain. Topic 3 (World Models and State Abstractions) asks what information belongs in
        - code [ref=f5e124]: state
        - text: rather than in the raw transcript. Topic 4 (Policies, Value, and Control) asks how
        - code [ref=f5e125]: choose_action
        - text: becomes a policy that remains useful under constraints and feedback.
