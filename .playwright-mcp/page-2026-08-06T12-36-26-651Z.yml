      - heading "The Markov Assumption Is a Design Choice" [level=3] [ref=f5e452]
      - paragraph [ref=f5e453]: "The Markov assumption is an interpretation, not a fact about reality. It says that the state representation is rich enough that the next transition can be modeled from the current state and action alone. When that assumption fails, the repair is usually one of three moves: better state, better memory, or a more cautious policy."
