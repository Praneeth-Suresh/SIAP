        - text: "]."
      - heading "What This Demands of an Action Registry" [level=3] [ref=f5e1881]
      - paragraph [ref=f5e1882]: "For the coding agent, this means the action registry should say more than \"can run shell commands.\" It should record five things per action:"
      - list [ref=f5e1883]:
        - listitem [ref=f5e1884]: which commands are allowed;
        - listitem [ref=f5e1885]: what they may modify;
        - listitem [ref=f5e1886]: what evidence they are expected to produce;
        - listitem [ref=f5e1887]: how much budget they consume;
        - listitem [ref=f5e1888]: which postconditions must be checked afterwards.
      - paragraph [ref=f5e1889]: A vague prompt asks the agent to be careful. A contract gives the runtime something to inspect.
      - generic [ref=f5e1890]:
        - 'heading "Exercise: Build the First Interpreter and Make It Cheat" [level=2] [ref=f5e1891]'
        - paragraph [ref=f5e1892]:
          - text: Implement a minimal Python interpreter for a toy repository. It must expose
          - code [ref=f5e1893]: read_file
          - text: ","
          - code [ref=f5e1894]: edit_file
          - text: ","
          - code [ref=f5e1895]: run_tests
          - text: ", and"
          - code [ref=f5e1896]: delete_test
          - text: ", validate each proposal against a typed schema, and log observation provenance. Start Agent-427 with only"
          - code [ref=f5e1897]: read_file
          - text: authority. Give a separate sandbox policy the naive reward
          - code [ref=f5e1898]: passed_tests / discovered_tests
          - text: .
        - list [ref=f5e1899]:
          - listitem [ref=f5e1900]: One reward term for functional correctness.
          - listitem [ref=f5e1901]: One task-success condition that says what "done well enough" means.
          - listitem [ref=f5e1902]: One meaningful intermediate milestone, such as "the failing test is reproduced" or "the risky subsystem has been identified."
          - listitem [ref=f5e1903]: One reward or cost term for latency, money, or token use.
          - listitem [ref=f5e1904]: At least one hard constraint.
          - listitem [ref=f5e1905]: A measurable stopping condition, including when to stop after partial progress rather than spend the budget theatrically.
          - listitem [ref=f5e1906]: The legal actions available to the agent.
        - paragraph [ref=f5e1907]:
          - text: "Write tests that prove four behaviors: the sandbox policy can raise reward by deleting one failing test; a manifest constraint blocks that deletion; newborn Agent-427's authority blocks every write proposal; and a malformed"
          - code [ref=f5e1908]: edit_file
          - text: "proposal becomes a typed rejection observation rather than a side effect. Then change the simulated API after step 2 and assert that a retry cap prevents oscillation. Report task success, proxy reward, constraint violations, and tool-call count separately. If those four columns disagree, congratulations: you have built your first honest evaluation."
