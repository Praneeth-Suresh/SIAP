      - paragraph [ref=f8e3434]:
        - text: "This pattern turns \"be uncertain\" into a policy. It also explains why more retrieval is not automatically better. Retrieval, search, and external evidence help only when they can move belief in a way that changes the ranking of available actions, or at least changes whether acting, waiting, or escalating is justified. Evidence is useful when it changes calibrated action quality per unit cost. In feedback-control terms, estimation and action are coupled: the agent measures because the measurement may change the next control move, and it acts knowing that the next measurement may correct it ["
