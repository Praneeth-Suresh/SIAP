      - heading "Why Approximate Belief Still Counts as Belief" [level=3] [ref=f8e1159]
      - paragraph [ref=f8e1160]: These equations are idealized. Real agents often use scores, hypotheses, retrieval rankings, or learned estimators instead of exact distributions. The key requirement is not mathematical ceremony. It is that observations change the variables that action selection depends on.
      - paragraph [ref=f8e1161]: "The pseudocode below shows the minimum shape of a belief update in a practical agent. It takes the old belief, a new observation, and the action just taken, and returns a new belief made of three parts: the surviving hypotheses, a recalibrated confidence, and the gaps that still matter for the decision."
      - code [ref=f8e1163]: "function UPDATE_BELIEF(belief, observation, action): hypotheses <- revise_hypotheses(belief.hypotheses, observation) confidence <- recalibrate(hypotheses, observation.source, observation.freshness) unknowns <- identify_decision_relevant_gaps(hypotheses) return Belief(hypotheses, confidence, unknowns)"
      - paragraph [ref=f8e1164]: In a coding agent, a failing test should increase belief in some fault hypotheses and decrease others. A missing dependency error should not be treated like a behavioral regression. A stale document should count as evidence with a weaker likelihood than a current API response. This is what it means for belief to be an operational object.
      - heading "The Assumption" [level=2] [ref=f8e1165]
      - paragraph [ref=f8e1166]: Bayesian filtering assumes that the hypotheses include the decision-relevant truth and that the transition and observation models assign evidence approximately honest likelihoods. It also assumes the factorization does not count one underlying event as several independent observations. Under those conditions, predict-then-correct is a disciplined update rather than probability-themed decoration.
      - blockquote [ref=f8e1168]:
        - paragraph [ref=f8e1169]:
          - strong [ref=f8e1170]: "Skeptical Engineer:"
          - text: “A probability table does not make the logs honest. Haven't we just moved uncertainty into
          - generic [ref=f8e1171]:
            - generic [ref=f8e1172]: Ω
            - math [ref=f8e1176]:
              - generic [ref=f8e1177]: Ω
          - text: "?”"
        - paragraph [ref=f8e1178]:
          - strong [ref=f8e1179]: "Author:"
          - text: We have made the uncertainty inspectable. The runtime can now ask who produced an observation, when, from which causal event, and how often that source has been wrong. “The model felt sure” exposes none of those handles.
      - heading "Decisions in Belief Space" [level=2] [ref=f8e1180]
      - paragraph [ref=f8e1181]:
