      - paragraph [ref=f8e78]:
        - text: Newborn Agent-427 may only read. Even so, reading does not reveal the world as it truly is. It reveals fragments, and must act anyway. Something has to turn those fragments into a picture solid enough to act on. That machinery is called
        - emphasis [ref=f8e79]: belief
        - text: ", and it is the second component of the interpreter we are building."
      - paragraph [ref=f8e80]:
        - text: The interpreter from Topic 1 (Goals, Environments, and Actions) cannot read the true state of the world directly. It sees test output, file contents, user messages, logs, retrieval results, and tool failures. Belief is the agent's working account of what those observations imply. It is not a mood of confidence. It is the state variable that makes action possible under
        - emphasis [ref=f8e81]: partial observability
        - text: (the ordinary situation in which the agent's sensors show only part of what is going on).
      - heading "Belief as Runtime State, Not a Feeling" [level=2] [ref=f8e82]
