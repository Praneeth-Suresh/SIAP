      - paragraph [ref=f8e4042]: Calibrated belief also changes what an agent can say about itself. A belief-aware customer-support agent can distinguish "I know the refund policy" from "I know the policy but not whether this order qualifies." A belief-aware coding agent can distinguish "the failing test localizes the bug" from "three modules remain plausible, so editing now is premature."
      - paragraph [ref=f8e4043]: "The interpreter has therefore gained its second component. Goals and actions define what the agent is trying to do; belief defines what the agent thinks is true enough to justify the next move. Topic 3 (World Models and State Abstractions) takes up the next question: which parts of the world deserve to be in the state at all."
