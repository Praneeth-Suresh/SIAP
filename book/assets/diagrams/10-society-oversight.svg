<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent society</title>
  <desc id="desc">Router delegates to specialists and a human while a meta-auditor samples evidence, decays trust, and controls a retirement gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">AN AGENT SOCIETY WITH AN EXIT</text><text class="subtitle" x="58" y="94">route, delegate, audit, decay trust, retire deliberately</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough amber"><rect x="460" y="140" width="280" height="95" rx="18"/><text class="label" x="600.0" y="179.5" text-anchor="middle">ROUTER R-3</text><text class="detail" x="600.0" y="211.5" text-anchor="middle">allocates task + authority</text></g><g class="rough "><rect x="65" y="330" width="220" height="95" rx="18"/><text class="label" x="175.0" y="369.5" text-anchor="middle">DRAFTER D-12</text><text class="detail" x="175.0" y="401.5" text-anchor="middle">reputation .78</text></g><g class="rough danger"><rect x="360" y="330" width="220" height="95" rx="18"/><text class="label" x="470.0" y="369.5" text-anchor="middle">CHECKER C-9</text><text class="detail" x="470.0" y="401.5" text-anchor="middle">reputation .42</text></g><g class="rough "><rect x="655" y="330" width="220" height="95" rx="18"/><text class="label" x="765.0" y="369.5" text-anchor="middle">AGENT-427</text><text class="detail" x="765.0" y="401.5" text-anchor="middle">reputation .61</text></g><g class="rough green"><rect x="950" y="330" width="190" height="95" rx="18"/><text class="label" x="1045.0" y="369.5" text-anchor="middle">HUMAN</text><text class="detail" x="1045.0" y="401.5" text-anchor="middle">appeal authority</text></g><g class=""><path class="arrow rough" d="M520,235 C347.5,227 347.5,338 175,330"/><text class="tiny" x="347.5" y="272.5" text-anchor="middle">CONTRACT</text></g><g class=""><path class="arrow rough" d="M570,235 C520.0,227 520.0,338 470,330"/><text class="tiny" x="520.0" y="272.5" text-anchor="middle">CONTRACT</text></g><g class=""><path class="arrow rough" d="M630,235 C697.5,227 697.5,338 765,330"/><text class="tiny" x="697.5" y="272.5" text-anchor="middle">CONTRACT</text></g><g class=""><path class="arrow rough" d="M700,235 C872.5,227 872.5,338 1045,330"/><text class="tiny" x="872.5" y="272.5" text-anchor="middle">ESCALATE</text></g><g class="rough green"><rect x="395" y="520" width="410" height="95" rx="18"/><text class="label" x="600.0" y="559.5" text-anchor="middle">META-AUDITOR M-1</text><text class="detail" x="600.0" y="591.5" text-anchor="middle">sample traces / revoke leases</text></g><g class=""><path class="arrow rough" d="M175,425 C312.5,417 312.5,528 450,520"/><text class="tiny" x="312.5" y="462.5" text-anchor="middle">EVIDENCE</text></g><g class=""><path class="arrow rough" d="M470,425 C497.5,417 497.5,528 525,520"/><text class="tiny" x="497.5" y="462.5" text-anchor="middle">EVIDENCE</text></g><g class=""><path class="arrow rough" d="M765,425 C727.5,417 727.5,528 690,520"/><text class="tiny" x="727.5" y="462.5" text-anchor="middle">EVIDENCE</text></g><g class="red"><path class="arrow rough" d="M805,568 C930,620 1060,580 1070,480"/><text class="tiny red" x="1010" y="620" text-anchor="middle">RETIREMENT GATE</text></g><text class="tiny" x="80" y="650">TRUST EARNS INTEREST ONLY WHEN VERIFIED OUTCOMES ARRIVE. OTHERWISE IT DECAYS.</text>
</svg>
