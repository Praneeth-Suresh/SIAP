<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Approximation stack</title>
  <desc id="desc">Five POMDP symbols mapped to imperfect production substitutes and their characteristic violations.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE APPROXIMATION STACK</text><text class="subtitle" x="58" y="94">the POMDP descends into production and loses a shoe</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough green"><rect x="70" y="140" width="260" height="78" rx="18"/><text class="label" x="200.0" y="171.0" text-anchor="middle">STATE  S</text><text class="detail" x="200.0" y="203.0" text-anchor="middle">finite sufficient state</text></g><g class=""><path class="arrow rough" d="M340,179 C420.0,171 420.0,187 500,179"/><text class="tiny" x="420.0" y="169.0" text-anchor="middle">COMPILE</text></g><g class="rough danger"><rect x="510" y="140" width="560" height="78" rx="18"/><text class="label" x="790.0" y="171.0" text-anchor="middle">PRODUCTION SUBSTITUTE</text><text class="detail" x="790.0" y="203.0" text-anchor="middle">context window + summary</text></g><text class="label red" x="1110" y="188">!</text><g class="rough green"><rect x="70" y="242" width="260" height="78" rx="18"/><text class="label" x="200.0" y="273.0" text-anchor="middle">DYNAMICS  T</text><text class="detail" x="200.0" y="305.0" text-anchor="middle">stationary law</text></g><g class=""><path class="arrow rough" d="M340,281 C420.0,273 420.0,289 500,281"/><text class="tiny" x="420.0" y="271.0" text-anchor="middle">COMPILE</text></g><g class="rough danger"><rect x="510" y="242" width="560" height="78" rx="18"/><text class="label" x="790.0" y="273.0" text-anchor="middle">PRODUCTION SUBSTITUTE</text><text class="detail" x="790.0" y="305.0" text-anchor="middle">APIs drift while thinking</text></g><text class="label red" x="1110" y="290">!</text><g class="rough green"><rect x="70" y="344" width="260" height="78" rx="18"/><text class="label" x="200.0" y="375.0" text-anchor="middle">OBSERVATION  OMEGA</text><text class="detail" x="200.0" y="407.0" text-anchor="middle">known noise model</text></g><g class=""><path class="arrow rough" d="M340,383 C420.0,375 420.0,391 500,383"/><text class="tiny" x="420.0" y="373.0" text-anchor="middle">COMPILE</text></g><g class="rough danger"><rect x="510" y="344" width="560" height="78" rx="18"/><text class="label" x="790.0" y="375.0" text-anchor="middle">PRODUCTION SUBSTITUTE</text><text class="detail" x="790.0" y="407.0" text-anchor="middle">delay + correlation + attack</text></g><text class="label red" x="1110" y="392">!</text><g class="rough green"><rect x="70" y="446" width="260" height="78" rx="18"/><text class="label" x="200.0" y="477.0" text-anchor="middle">REWARD  R</text><text class="detail" x="200.0" y="509.0" text-anchor="middle">objective names desire</text></g><g class=""><path class="arrow rough" d="M340,485 C420.0,477 420.0,493 500,485"/><text class="tiny" x="420.0" y="475.0" text-anchor="middle">COMPILE</text></g><g class="rough danger"><rect x="510" y="446" width="560" height="78" rx="18"/><text class="label" x="790.0" y="477.0" text-anchor="middle">PRODUCTION SUBSTITUTE</text><text class="detail" x="790.0" y="509.0" text-anchor="middle">metric becomes a loophole</text></g><text class="label red" x="1110" y="494">!</text><g class="rough green"><rect x="70" y="548" width="260" height="78" rx="18"/><text class="label" x="200.0" y="579.0" text-anchor="middle">POLICY  PI</text><text class="detail" x="200.0" y="611.0" text-anchor="middle">choose any valid action</text></g><g class=""><path class="arrow rough" d="M340,587 C420.0,579 420.0,595 500,587"/><text class="tiny" x="420.0" y="577.0" text-anchor="middle">COMPILE</text></g><g class="rough danger"><rect x="510" y="548" width="560" height="78" rx="18"/><text class="label" x="790.0" y="579.0" text-anchor="middle">PRODUCTION SUBSTITUTE</text><text class="detail" x="790.0" y="611.0" text-anchor="middle">generate, parse, guard, reject</text></g><text class="label red" x="1110" y="596">!</text><text class="tiny" x="1080" y="665" text-anchor="end">FORMALISM IS A MAP. THE POTHOLES STILL HAVE PRIORITY.</text>
</svg>
