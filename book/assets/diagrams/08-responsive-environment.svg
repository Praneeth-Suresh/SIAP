<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Responsive environment</title>
  <desc id="desc">A delayed queue sensor and adversary feed an estimator and controller, with timeout modeled as an explicit action.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE RESPONSIVE ENVIRONMENT</text><text class="subtitle" x="58" y="94">the world moves while Agent-427 is still choosing a verb</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough danger"><rect x="55" y="260" width="200" height="100" rx="18"/><text class="label" x="155.0" y="302.0" text-anchor="middle">QUEUE</text><text class="detail" x="155.0" y="334.0" text-anchor="middle">hidden depth x</text></g><g class="rough amber"><rect x="335" y="155" width="220" height="95" rx="18"/><text class="label" x="445.0" y="194.5" text-anchor="middle">SENSOR</text><text class="detail" x="445.0" y="226.5" text-anchor="middle">delayed y</text></g><g class="rough danger"><rect x="335" y="375" width="220" height="95" rx="18"/><text class="label" x="445.0" y="414.5" text-anchor="middle">ADVERSARY</text><text class="detail" x="445.0" y="446.5" text-anchor="middle">spoof / withhold</text></g><g class="rough green"><rect x="645" y="210" width="220" height="105" rx="18"/><text class="label" x="755.0" y="254.5" text-anchor="middle">KALMAN ESTIMATE</text><text class="detail" x="755.0" y="286.5" text-anchor="middle">predict + correct</text></g><g class="rough "><rect x="945" y="210" width="205" height="105" rx="18"/><text class="label" x="1047.5" y="254.5" text-anchor="middle">CONTROLLER</text><text class="detail" x="1047.5" y="286.5" text-anchor="middle">scale / wait / stop</text></g><g class=""><path class="arrow rough" d="M255,295 C295.0,287 295.0,213 335,205"/><text class="tiny" x="295.0" y="240.0" text-anchor="middle">TELEMETRY</text></g><g class=""><path class="arrow rough" d="M555,205 C600.0,197 600.0,258 645,250"/><text class="tiny" x="600.0" y="217.5" text-anchor="middle">MEASURE</text></g><g class="red"><path class="arrow rough" d="M555,420 C600.0,412 600.0,288 645,280"/><text class="tiny" x="600.0" y="340.0" text-anchor="middle">POISON</text></g><g class=""><path class="arrow rough" d="M865,262 C905.0,254 905.0,270 945,262"/><text class="tiny" x="905.0" y="252.0" text-anchor="middle">BELIEF</text></g><g class="red"><path class="arrow rough" d="M1048,315 C1080,500 235,560 150,360"/><text class="tiny red" x="660" y="550" text-anchor="middle">ACTUATION CHANGES THE NEXT OBSERVATION</text></g><g class="rough amber"><rect x="915" y="430" width="240" height="90" rx="18"/><text class="label" x="1035.0" y="467.0" text-anchor="middle">TIMEOUT</text><text class="detail" x="1035.0" y="499.0" text-anchor="middle">stop waiting = action</text></g><g class=""><path class="arrow rough" d="M1048,315 C1041.5,307 1041.5,438 1035,430"/><text class="tiny" x="1041.5" y="362.5" text-anchor="middle">CLOCK</text></g>
</svg>
