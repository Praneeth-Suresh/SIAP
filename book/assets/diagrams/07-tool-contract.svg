<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tool contract</title>
  <desc id="desc">A model proposal passes schema, authority, and idempotency guards before an external effect and confirmation observation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">A TOOL CALL CROSSES A BORDER</text><text class="subtitle" x="58" y="94">language proposes; contracts decide whether reality must care</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough amber"><rect x="55" y="240" width="220" height="100" rx="18"/><text class="label" x="165.0" y="282.0" text-anchor="middle">MODEL PROPOSAL</text><text class="detail" x="165.0" y="314.0" text-anchor="middle">deploy(env=prod?)</text></g><g class="rough "><rect x="350" y="145" width="250" height="80" rx="18"/><text class="label" x="475.0" y="177.0" text-anchor="middle">SCHEMA</text><text class="detail" x="475.0" y="209.0" text-anchor="middle">arguments parse</text></g><g class="rough "><rect x="350" y="260" width="250" height="80" rx="18"/><text class="label" x="475.0" y="292.0" text-anchor="middle">AUTHORITY</text><text class="detail" x="475.0" y="324.0" text-anchor="middle">caller may act</text></g><g class="rough "><rect x="350" y="375" width="250" height="80" rx="18"/><text class="label" x="475.0" y="407.0" text-anchor="middle">LEDGER</text><text class="detail" x="475.0" y="439.0" text-anchor="middle">idempotency key</text></g><g class="rough green"><rect x="695" y="240" width="210" height="100" rx="18"/><text class="label" x="800.0" y="282.0" text-anchor="middle">EFFECT</text><text class="detail" x="800.0" y="314.0" text-anchor="middle">world changes</text></g><g class="rough "><rect x="980" y="240" width="170" height="100" rx="18"/><text class="label" x="1065.0" y="282.0" text-anchor="middle">OBSERVE</text><text class="detail" x="1065.0" y="314.0" text-anchor="middle">confirm result</text></g><g class=""><path class="arrow rough" d="M275,290 C312.5,282 312.5,298 350,290"/><text class="tiny" x="312.5" y="280.0" text-anchor="middle">PARSE</text></g><g class=""><path class="arrow rough" d="M600,290 C647.5,282 647.5,298 695,290"/><text class="tiny" x="647.5" y="280.0" text-anchor="middle">ALL PASS</text></g><g class=""><path class="arrow rough" d="M905,290 C942.5,282 942.5,298 980,290"/><text class="tiny" x="942.5" y="280.0" text-anchor="middle">RECEIPT</text></g><g class="red"><path class="arrow rough" d="M475,455 C475,535 165,535 165,340"/><text class="tiny red" x="330" y="525" text-anchor="middle">REJECT, DO NOT IMPROVISE</text></g><text class="tiny" x="600" y="630" text-anchor="middle">A JSON OBJECT IS NOT AUTHORITY. IT IS A REQUEST WE CAN REFUSE.</text>
</svg>
