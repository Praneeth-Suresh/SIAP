<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent interpreter</title>
  <desc id="desc">Observe, update state, choose, execute, and judge connected by internal and external feedback loops.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:34px; font-weight:bold; }
      .subtitle { font-size:16px; letter-spacing:1px; }
      .label { font-size:19px; font-weight:bold; }
      .detail { font-size:14px; }
      .tiny { font-size:13px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE AGENT INTERPRETER</text><text class="subtitle" x="58" y="94">one loop, two feedback paths, several places to confess ignorance</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough green"><rect x="80" y="175" width="200" height="88" rx="18"/><text class="label" x="180.0" y="211.0" text-anchor="middle">OBSERVE</text><text class="detail" x="180.0" y="243.0" text-anchor="middle">raw evidence</text></g><g class="rough "><rect x="365" y="175" width="220" height="88" rx="18"/><text class="label" x="475.0" y="211.0" text-anchor="middle">UPDATE STATE</text><text class="detail" x="475.0" y="243.0" text-anchor="middle">belief + budget</text></g><g class="rough "><rect x="670" y="175" width="205" height="88" rx="18"/><text class="label" x="772.5" y="211.0" text-anchor="middle">CHOOSE</text><text class="detail" x="772.5" y="243.0" text-anchor="middle">legal action only</text></g><g class="rough amber"><rect x="955" y="175" width="180" height="88" rx="18"/><text class="label" x="1045.0" y="211.0" text-anchor="middle">EXECUTE</text><text class="detail" x="1045.0" y="243.0" text-anchor="middle">external effect</text></g><g class=""><path class="arrow rough" d="M280,219 C322.5,211 322.5,227 365,219"/></g><g class=""><path class="arrow rough" d="M585,219 C627.5,211 627.5,227 670,219"/></g><g class=""><path class="arrow rough" d="M875,219 C915.0,211 915.0,227 955,219"/></g><g class="rough green"><rect x="455" y="370" width="290" height="105" rx="18"/><text class="label" x="600.0" y="414.5" text-anchor="middle">THE VERDICT</text><text class="detail" x="600.0" y="446.5" text-anchor="middle">utility / safety / calibration</text></g><g class=""><path class="arrow rough" d="M1045,263 C895.0,255 895.0,413 745,405"/><text class="tiny" x="895.0" y="324.0" text-anchor="middle">OUTCOME</text></g><g class=""><path class="arrow rough" d="M455,423 C317.5,415 317.5,271 180,263"/><text class="tiny" x="317.5" y="333.0" text-anchor="middle">FEEDBACK</text></g><path class="scribble" d="M1000,510 C960,590 790,600 760,515"/><text class="tiny red" x="882" y="620" text-anchor="middle">INVALID TOOL CALL? REJECT THE TRANSITION.</text><g class="danger rough"><circle cx="225" cy="530" r="55"/><text class="label" x="225" y="525" text-anchor="middle">HALT</text><text class="detail" x="225" y="550" text-anchor="middle">is an action</text></g><g class="red"><path class="arrow rough" d="M455,450 C367.5,442 367.5,528 280,520"/><text class="tiny" x="367.5" y="475.0" text-anchor="middle">BUDGET GONE</text></g>
</svg>
