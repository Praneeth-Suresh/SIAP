<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">State abstraction and compression</title>
  <desc id="desc">A detailed agent history passes through phi into a compact decision state that preserves legal action, authority, branch, and budget while discarding irrelevant detail.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">STATE ABSTRACTION</text><text class="subtitle" x="58" y="94">compress the history; preserve the choice</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough ghost"><rect x="60" y="155" width="280" height="340" rx="18"/><text class="label" x="200" y="194" text-anchor="middle">DETAILED HISTORY</text><line x1="78" y1="216" x2="322" y2="216"/><text class="detail" x="200" y="246" text-anchor="middle">many truths; one decision</text></g><text class="detail" x="200" y="292" text-anchor="middle">branch = legacy-v2</text><text class="detail" x="200" y="330" text-anchor="middle">tests = red</text><text class="detail" x="200" y="368" text-anchor="middle">cache = stale</text><text class="detail" x="200" y="406" text-anchor="middle">authority = read-only</text><text class="detail" x="200" y="444" text-anchor="middle">budget = 3 calls</text><text class="detail" x="200" y="482" text-anchor="middle">two jokes about YAML</text><polygon class="rough" points="405,185 610,260 610,390 405,465" fill="#efe0b8"/><text class="label" x="500" y="315" text-anchor="middle">PHI</text><text class="detail" x="500" y="345" text-anchor="middle">decision compression</text><g class=""><path class="arrow rough" d="M340,325 C385.0,317 385.0,333 430,325"/><text class="tiny" x="385.0" y="315.0" text-anchor="middle">MERGE</text></g><g class="rough green"><rect x="680" y="160" width="440" height="105" rx="18"/><text class="label" x="900.0" y="204.5" text-anchor="middle">ABSTRACT STATE z</text><text class="detail" x="900.0" y="236.5" text-anchor="middle">legacy-v2 / red / read-only / 3 calls</text></g><g class="rough green"><rect x="680" y="325" width="205" height="105" rx="18"/><text class="label" x="782.5" y="369.5" text-anchor="middle">LEGAL ACTION</text><text class="detail" x="782.5" y="401.5" text-anchor="middle">inspect manifest</text></g><g class="rough danger"><rect x="915" y="325" width="205" height="105" rx="18"/><text class="label" x="1017.5" y="369.5" text-anchor="middle">BLOCKED ACTION</text><text class="detail" x="1017.5" y="401.5" text-anchor="middle">edit + deploy</text></g><g class=""><path class="arrow rough" d="M610,325 C645.0,317 645.0,220 680,212"/><text class="tiny" x="645.0" y="258.5" text-anchor="middle">PRESERVE</text></g><g class=""><path class="arrow rough" d="M900,265 C842.5,257 842.5,333 785,325"/><text class="tiny" x="842.5" y="285.0" text-anchor="middle">CHOOSE</text></g><g class="red"><path class="arrow rough" d="M900,265 C957.5,257 957.5,333 1015,325"/><text class="tiny" x="957.5" y="285.0" text-anchor="middle">GUARD</text></g><g class="red"><path class="arrow rough" d="M500,465 C500,540 360,555 300,520"/><text class="tiny red" x="470" y="560" text-anchor="middle">DROP THE JOKE; KEEP THE BRANCH.</text></g><text class="tiny" x="600" y="635" text-anchor="middle">TWO HISTORIES MAY MERGE ONLY IF THE CONSEQUENT ACTIONS STILL AGREE.</text>
</svg>
