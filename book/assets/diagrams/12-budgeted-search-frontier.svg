<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Budgeted search frontier</title>
  <desc id="desc">A search tree accumulates scored frontier nodes until a budget line interrupts it, returning the best surviving plan for one action before observation and replanning.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:34px; font-weight:bold; }
      .subtitle { font-size:16px; letter-spacing:1px; }
      .label { font-size:19px; font-weight:bold; }
      .detail { font-size:14px; }
      .tiny { font-size:13px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE BUDGETED SEARCH FRONTIER</text><text class="subtitle" x="58" y="94">the clock interrupts; the best surviving plan answers</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough green"><circle cx="115" cy="270" r="45"/><text class="label" x="115" y="278" text-anchor="middle">s0</text></g><g class="rough ghost"><circle cx="295" cy="175" r="38"/><text class="label" x="295" y="172" text-anchor="middle">A</text><text class="detail" x="295" y="196" text-anchor="middle">4.8</text></g><g class="rough ghost"><circle cx="295" cy="300" r="38"/><text class="label" x="295" y="297" text-anchor="middle">B</text><text class="detail" x="295" y="321" text-anchor="middle">5.3</text></g><g class="rough ghost"><circle cx="295" cy="425" r="38"/><text class="label" x="295" y="422" text-anchor="middle">C</text><text class="detail" x="295" y="446" text-anchor="middle">3.1</text></g><g class="rough amber"><circle cx="485" cy="140" r="38"/><text class="label" x="485" y="137" text-anchor="middle">A1</text><text class="detail" x="485" y="161" text-anchor="middle">5.0</text></g><g class="rough ghost"><circle cx="485" cy="245" r="38"/><text class="label" x="485" y="242" text-anchor="middle">A2</text><text class="detail" x="485" y="266" text-anchor="middle">4.2</text></g><g class="rough green"><circle cx="485" cy="350" r="38"/><text class="label" x="485" y="347" text-anchor="middle">B1</text><text class="detail" x="485" y="371" text-anchor="middle">6.1</text></g><g class="rough amber"><circle cx="485" cy="455" r="38"/><text class="label" x="485" y="452" text-anchor="middle">B2</text><text class="detail" x="485" y="476" text-anchor="middle">5.6</text></g><g class=""><path class="arrow rough" d="M158,250 C207.5,242 207.5,198 257,190"/></g><g class=""><path class="arrow rough" d="M160,270 C208.5,262 208.5,308 257,300"/></g><g class=""><path class="arrow rough" d="M158,290 C207.5,282 207.5,418 257,410"/></g><g class=""><path class="arrow rough" d="M333,175 C390.0,167 390.0,148 447,140"/></g><g class=""><path class="arrow rough" d="M333,185 C390.0,177 390.0,243 447,235"/></g><g class=""><path class="arrow rough" d="M333,300 C390.0,292 390.0,358 447,350"/></g><g class=""><path class="arrow rough" d="M333,315 C390.0,307 390.0,453 447,445"/></g><g class="red"><line x1="575" y1="135" x2="575" y2="515" stroke-dasharray="12 9"/><text class="label red" x="575" y="555" text-anchor="middle">BUDGET EXPIRES</text></g><g class="rough amber"><rect x="655" y="155" width="220" height="95" rx="18"/><text class="label" x="765.0" y="194.5" text-anchor="middle">FRONTIER</text><text class="detail" x="765.0" y="226.5" text-anchor="middle">A1  B1  B2</text></g><g class="rough green"><rect x="655" y="320" width="220" height="95" rx="18"/><text class="label" x="765.0" y="359.5" text-anchor="middle">BEST SO FAR</text><text class="detail" x="765.0" y="391.5" text-anchor="middle">B -&gt; B1  score 6.1</text></g><g class="rough green"><rect x="945" y="235" width="195" height="115" rx="18"/><text class="label" x="1042.5" y="284.5" text-anchor="middle">EXECUTE ONE</text><text class="detail" x="1042.5" y="316.5" text-anchor="middle">observe; replan</text></g><g class=""><path class="arrow rough" d="M575,350 C615.0,342 615.0,375 655,367"/><text class="tiny" x="615.0" y="348.5" text-anchor="middle">INTERRUPT</text></g><g class=""><path class="arrow rough" d="M875,367 C910.0,359 910.0,300 945,292"/><text class="tiny" x="910.0" y="319.5" text-anchor="middle">RETURN</text></g><text class="tiny red" x="760" y="500" text-anchor="middle">PRUNED BRANCHES STILL BELONG IN THE TRACE.</text><text class="tiny" x="600" y="635" text-anchor="middle">AN ANYTIME PLANNER OWES YOU A PLAN BEFORE IT OWES YOU OPTIMALITY.</text>
</svg>
