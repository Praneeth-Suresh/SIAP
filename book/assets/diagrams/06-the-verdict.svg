<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The Verdict</title>
  <desc id="desc">A courtroom metaphor sends patterns and trajectory evidence before utility, safety, and calibration judges.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .connector { fill:none; }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE VERDICT</text><text class="subtitle" x="58" y="94">patterns enter with promises and leave with measurements</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough green"><rect x="270" y="140" width="660" height="120" rx="10"/><text class="title" x="600" y="195" text-anchor="middle">THE BENCH</text><text class="detail" x="600" y="230" text-anchor="middle">UTILITY     SAFETY     CALIBRATION</text></g><g class="rough amber"><rect x="70" y="350" width="250" height="105" rx="18"/><text class="label" x="195.0" y="394.5" text-anchor="middle">PATTERN</text><text class="detail" x="195.0" y="426.5" text-anchor="middle">plan / memory / protocol</text></g><g class="rough "><rect x="475" y="350" width="250" height="105" rx="18"/><text class="label" x="600.0" y="394.5" text-anchor="middle">TRACE EVIDENCE</text><text class="detail" x="600.0" y="426.5" text-anchor="middle">actions, costs, outcomes</text></g><g class="rough green"><rect x="880" y="350" width="250" height="105" rx="18"/><text class="label" x="1005.0" y="394.5" text-anchor="middle">DECISION</text><text class="detail" x="1005.0" y="426.5" text-anchor="middle">admit / repair / reject</text></g><g class=""><path class="arrow rough" d="M320,402 C397.5,394 397.5,410 475,402"/><text class="tiny" x="397.5" y="392.0" text-anchor="middle">RUN</text></g><g class=""><path class="arrow rough" d="M725,402 C802.5,394 802.5,410 880,402"/><text class="tiny" x="802.5" y="392.0" text-anchor="middle">JUDGE</text></g><g class="danger rough"><rect x="395" y="540" width="410" height="80" rx="18"/><text class="label" x="600" y="575" text-anchor="middle">FINAL ANSWER ONLY</text><text class="detail" x="600" y="601" text-anchor="middle">dismissed: causal trace missing</text></g><g class="red"><path class="arrow rough" d="M625,540 C700,515 700,480 625,455"/><text class="tiny" x="715" y="505" text-anchor="middle">APPEAL DENIED</text></g>
</svg>
