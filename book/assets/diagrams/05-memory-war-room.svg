<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Memory war room</title>
  <desc id="desc">A forklift-like memory controller moves versioned evidence among raw, episodic, semantic, and working stores while stale memory threatens context.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#172a3a"/></marker>
    <marker id="red-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b24c2b"/></marker>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="427" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2"/></filter>
    <style>
      .paper { fill:#f4f0e6; }
      text { fill:#172a3a; font-family:"Courier New",monospace; }
      .title { font-family:Georgia,serif; font-size:38px; font-weight:bold; }
      .subtitle { font-size:18px; letter-spacing:0.8px; }
      .label { font-size:22px; font-weight:bold; }
      .detail { font-size:17px; }
      .tiny { font-size:16px; font-weight:bold; paint-order:stroke; stroke:#f4f0e6; stroke-width:5px; stroke-linejoin:round; }
      .rough { filter:url(#wobble); }
      rect, circle, ellipse, path, line, polygon { fill:#fbf8ef; stroke:#172a3a; stroke-width:3; }
      .arrow { fill:none; marker-end:url(#arrow); }
      .red .arrow, .red path, .red line, .red rect, .red circle { stroke:#b24c2b; }
      .red .arrow { marker-end:url(#red-arrow); }
      .red text, text.red { fill:#b24c2b; }
      .green rect, .green circle { fill:#dbe4d5; }
      .amber rect, .amber circle { fill:#efe0b8; }
      .danger rect, .danger circle { fill:#f0c9bb; stroke:#b24c2b; }
      .ghost rect, .ghost circle { fill:#e3e7e3; stroke-dasharray:9 7; }
      .scribble { fill:none; stroke:#b24c2b; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="paper" width="1200" height="700" stroke="none"/>
  <text class="title" x="56" y="62">THE MEMORY WAR ROOM</text><text class="subtitle" x="58" y="94">a warehouse, a forklift, and one barrel marked DO NOT RETRIEVE</text><path class="scribble" d="M56,108 C260,101 410,116 620,107"/><g class="rough green"><rect x="60" y="155" width="300" height="90" rx="18"/><text class="label" x="210.0" y="192.0" text-anchor="middle">RAW EVIDENCE</text><text class="detail" x="210.0" y="224.0" text-anchor="middle">immutable receipts</text></g><g class="rough "><rect x="60" y="285" width="300" height="90" rx="18"/><text class="label" x="210.0" y="322.0" text-anchor="middle">EPISODIC</text><text class="detail" x="210.0" y="354.0" text-anchor="middle">versioned traces</text></g><g class="rough "><rect x="60" y="415" width="300" height="90" rx="18"/><text class="label" x="210.0" y="452.0" text-anchor="middle">SEMANTIC</text><text class="detail" x="210.0" y="484.0" text-anchor="middle">consolidated rules</text></g><g class="rough amber"><rect x="800" y="210" width="330" height="120" rx="18"/><text class="label" x="965.0" y="262.0" text-anchor="middle">WORKING CONTEXT</text><text class="detail" x="965.0" y="294.0" text-anchor="middle">small, expensive, decisive</text></g><g class="rough"><rect x="440" y="285" width="285" height="120" rx="8"/><circle cx="485" cy="430" r="30"/><circle cx="675" cy="430" r="30"/><text class="label" x="582" y="325" text-anchor="middle">FORKLIFT</text><text class="detail" x="582" y="356" text-anchor="middle">retrieve / compress</text><text class="detail" x="582" y="382" text-anchor="middle">then evict</text><path d="M725,315 L765,315 L765,260" fill="none"/></g><g class=""><path class="arrow rough" d="M360,330 C400.0,322 400.0,343 440,335"/><text class="tiny" x="400.0" y="322.5" text-anchor="middle">QUERY</text></g><g class=""><path class="arrow rough" d="M765,260 C782.5,252 782.5,268 800,260"/><text class="tiny" x="782.5" y="250.0" text-anchor="middle">LOAD</text></g><g class="danger rough"><ellipse cx="938" cy="480" rx="155" ry="75"/><text class="label red" x="938" y="465" text-anchor="middle">STALE MEMORY</text><text class="detail" x="938" y="495" text-anchor="middle">main YAML in legacy-v2 TOML</text></g><g class="red"><path class="arrow rough" d="M938,405 C951.5,397 951.5,338 965,330"/><text class="tiny" x="951.5" y="357.5" text-anchor="middle">CONTAMINATES</text></g><text class="tiny" x="60" y="610">CONSOLIDATE WHAT REPEATS. KEEP THE EDGE CASE RECEIPT.</text>
</svg>
